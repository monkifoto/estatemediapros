<div class="container">
  <section class="photo-gallery-section">

    <!-- Photography Gallery -->
    <div class="photo-category">
      <h2 class="category-title montserrat-h2">Photography Gallery</h2>
      <p class="category-description roboto-slab-about">
        Explore a curated collection of high-definition interior and exterior photographs.
      </p>
      <div class="image-grid">
        <div class="gallery-image-wrapper" *ngFor="let image of photoGallery" (click)="openModal(image)">
          <img [src]="image" alt="Photography Image">
        </div>
      </div>
    </div>

    <hr class="gallery-divider">

    <!-- Aerial & Drone Photography Gallery -->
    <div class="photo-category">
      <h2 class="category-title montserrat-h2">Aerial & Drone Photography</h2>
      <p class="category-description roboto-slab-about">
        Discover properties from a new perspective with our stunning aerial and drone photography.
      </p>
      <div class="image-grid">
        <div class="gallery-image-wrapper" *ngFor="let image of aerialGallery" (click)="openModal(image)">
          <img [src]="image" alt="Aerial Image">
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="image-modal" *ngIf="modalImage" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <span class="close-button" (click)="closeModal()">×</span>
        <img [src]="modalImage" alt="Full Image">
      </div>
    </div>

  </section>
</div>
